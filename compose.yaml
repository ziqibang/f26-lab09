# CampusReserve as copies behind one proxy.
#
#   docker compose up -d --build
#
# api runs as two copies (deploy.replicas). It has no host port and no
# container_name, so it can scale. Each copy
# listens on 8080 inside the network (Dockerfile CMD) and is reachable from
# other containers as "api" (every copy) or by its own container name
# (one copy, see `docker compose ps`).

services:
  api:
    build: .
    deploy:
      replicas: 2

  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - api

  # Load generator. In the "load" profile so `up` leaves it alone; run it with
  # `docker compose run --rm --no-deps k6 run /load/<script>.js`.
  # --no-deps matters: without it, `run` starts the dependencies again and can
  # scale api back down to one copy, which makes both tests pass falsely.
  k6:
    image: grafana/k6:2.3.0
    profiles: ["load"]
    volumes:
      - ./load:/load:ro
    depends_on:
      - proxy
